[package]
name = "honcho-db"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# in-memory scripted driver, for tests and UI work before real drivers land
fake = []

[dependencies]
async-trait = "0.1"
directories = "6.0.0"
mysql_async = { version = "0.37", default-features = false, features = ["default-rustls-ring"] }
russh = { version = "0.65", default-features = false, features = ["ring", "rsa", "flate2"] }
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
tokio-util = "0.7"

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "test-util"] }
