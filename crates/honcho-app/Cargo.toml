[package]
name = "sql-honcho"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "sql-honcho"
path = "src/main.rs"

[dependencies]
similar = "2"
directories = "6.0.0"
honcho-config = { path = "../honcho-config" }
honcho-core = { path = "../honcho-core" }
honcho-db = { path = "../honcho-db" }
serde_json = "1.0.154"
tokio-util = "0.7"

# runtime_shaders avoids needing Xcode's Metal toolchain; Linux and Windows
# use gpui's defaults (wayland + x11, DirectX)
[target.'cfg(target_os = "macos")'.dependencies]
gpui = { version = "0.2.2", default-features = false, features = ["font-kit", "runtime_shaders"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
gpui = "0.2.2"

[dev-dependencies]
gpui = { version = "0.2.2", default-features = false, features = ["test-support"] }
honcho-db = { path = "../honcho-db", features = ["fake"] }
tempfile = "3"
rusqlite = { version = "0.41", default-features = false, features = ["bundled"] }
