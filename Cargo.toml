[workspace]
resolver = "2"
members = ["crates/honcho-core", "crates/honcho-db", "crates/honcho-config", "crates/honcho-app"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/NonGT/sql-honcho"

# The rustls name check fix (blackbeam/mysql_async#408) is not released yet;
# without it verify-ca behaves like verify-full. Drop this after 0.37.1.
[patch.crates-io]
mysql_async = { git = "https://github.com/blackbeam/mysql_async", rev = "d7525dcb1d35f3d60101a2e95e84171c3d3ac4a5" }
# Client::simple_batch, for PRINT output and row counts (tiberius-rs/tiberius#468),
# plus a cancel fix (branch honcho): read up to the attention ack by whole
# packets, or the next query can read the cancelled one's leftovers.
tiberius = { git = "https://github.com/NonGT/tiberius", rev = "402184e62ec1f5402febe97c0a49f5a649213bb0" }
